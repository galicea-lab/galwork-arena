name: Weryfikacja i mirror GitHub

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Znaczniki AI (development)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/check-ai-comments.mjs

      - name: Znaczniki AI (wydanie)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/check-ai-comments.mjs --release

      - name: Push mirrora
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: galicea-lab/galwork-arena
        run: |
          set -euo pipefail
          [ -n "$MIRROR_TOKEN" ] || { echo "::error::Brak sekretu MIRROR_TOKEN w ustawieniach repozytorium (Settings → Actions → Secrets)"; exit 1; }
          [ -n "$MIRROR_REPO" ]  || { echo "::error::Brak zmiennej MIRROR_REPO"; exit 1; }

          git clone --depth 1 \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" \
            "$RUNNER_TEMP/mirror" \
            || { echo "::error::Nie udało się sklonować github.com/${MIRROR_REPO} – sprawdź, czy MIRROR_TOKEN jest ważny i ma dostęp do tego repozytorium"; exit 1; }

          find "$RUNNER_TEMP/mirror" -mindepth 1 -maxdepth 1 \
            ! -name .git -exec rm -rf {} +

          # Eksport plików śledzonych przez Git (ukośnik na końcu --prefix jest wymagany)
          git checkout-index -a -f --prefix="$RUNNER_TEMP/mirror/"
          rm -rf "$RUNNER_TEMP/mirror/docs/internal"

          cd "$RUNNER_TEMP/mirror"
          git config user.name "galicea-mirror"
          git config user.email "mirror@galicea.org"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak zmian do publikacji."
            exit 0
          fi
          git commit -m "${{ github.ref_name }}"
          git push origin HEAD:main \
            || { echo "::error::Push do github.com/${MIRROR_REPO} nie powiódł się – token potrzebuje uprawnienia Contents: Read and write"; exit 1; }